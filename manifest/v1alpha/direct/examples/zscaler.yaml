apiVersion: n9/v1alpha
kind: Direct
metadata:
  name: zscaler
  displayName: Zscaler Direct
  project: default
  annotations:
    area: latency
    env: prod
    region: us
    team: sales
spec:
  description: Example Zscaler Direct
  releaseChannel: beta
  zscaler:
    vanityDomain: example
    clientId: "[secret]"
    clientSecret: "[secret]"
  historicalDataRetrieval:
    maxDuration:
      value: 14
      unit: Day
    defaultDuration:
      value: 7
      unit: Day
  queryDelay:
    value: 21
    unit: Minute
