- apiVersion: n9/v1alpha
  kind: Agent
  metadata:
    name: cloud-watch
    displayName: CloudWatch Agent
    project: default
    annotations:
      area: latency
      env: prod
      region: us
      team: sales
  spec:
    description: Example CloudWatch Agent
    releaseChannel: beta
    cloudWatch: {}
    historicalDataRetrieval:
      maxDuration:
        value: 15
        unit: Day
      defaultDuration:
        value: 7
        unit: Day
    queryDelay:
      value: 2
      unit: Minute
# region failover
- apiVersion: n9/v1alpha
  kind: Agent
  metadata:
    name: cloud-watch-failover
    displayName: CloudWatch Agent
    project: default
    annotations:
      area: latency
      env: prod
      region: us
      team: sales
  spec:
    description: Example CloudWatch Agent with region failover
    releaseChannel: beta
    cloudWatch:
      failover:
        enabled: true
        primaryRegion: us-west-2
        failoverRegion: us-east-1
    historicalDataRetrieval:
      maxDuration:
        value: 15
        unit: Day
      defaultDuration:
        value: 7
        unit: Day
    queryDelay:
      value: 2
      unit: Minute
