apiVersion: n9/v1alpha
kind: Agent
metadata:
  name: zscaler
  displayName: Zscaler Agent
  project: default
  annotations:
    area: latency
    env: prod
    region: us
    team: sales
spec:
  description: Example Zscaler Agent
  releaseChannel: beta
  zscaler:
    vanityDomain: example
  historicalDataRetrieval:
    maxDuration:
      value: 14
      unit: Day
    defaultDuration:
      value: 7
      unit: Day
  queryDelay:
    value: 21
    unit: Minute
