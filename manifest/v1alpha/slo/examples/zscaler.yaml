# Metric type: threshold
# Metric variant: availability
# Budgeting method: Occurrences
# Time window type: Calendar
- apiVersion: n9/v1alpha
  kind: SLO
  metadata:
    name: api-server-slo
    displayName: API Server SLO
    project: default
    labels:
      area:
      - latency
      - slow-check
      env:
      - prod
      - dev
      region:
      - us
      - eu
      team:
      - green
      - sales
    annotations:
      area: latency
      env: prod
      region: us
      team: sales
  spec:
    description: Example Zscaler SLO
    indicator:
      metricSource:
        name: zscaler
        project: default
        kind: Agent
    budgetingMethod: Occurrences
    objectives:
    - displayName: Web probe reports full availability
      value: 100.0
      name: ok
      target: 0.999
      rawMetric:
        query:
          zscaler:
            type: web-probe
            metric: availability
            appId: 12345
            deviceId: 67890
            probeId: 13579
      op: gte
      primary: true
    service: api-server
    timeWindows:
    - unit: Month
      count: 1
      isRolling: false
      calendar:
        startTime: "2022-12-01 00:00:00"
        timeZone: UTC
    alertPolicies:
    - fast-burn-5x-for-last-10m
    attachments:
    - url: https://docs.nobl9.com
      displayName: Nobl9 Documentation
    anomalyConfig:
      noData:
        alertMethods:
        - name: slack-notification
          project: default
        alertAfter: 1h
        treatZeroAsNoData: false
